{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5">
        <div class="card p-4 border-0 shadow">
            <div class="text-center mb-4">
                <span class="fs-1">🔒</span>
                <h3 class="fw-bold mt-2">Admin Workspace Access</h3>
                <p class="text-muted small">Authentication required to access system dashboards.</p>
            </div>
            <form action="{{ url_for('admin_login') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Admin Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Enter username" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Secret Key Credentials</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn btn-dark w-100 py-2">Authenticate Login Session</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
